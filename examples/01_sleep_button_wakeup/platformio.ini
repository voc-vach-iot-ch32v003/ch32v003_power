[platformio]
default_envs = CH32V003J4M6

[env]
platform = ch32v
framework = ch32v003fun
upload_protocol = minichlink
debug_tool = minichlink
extra_scripts = ch32v003_extra_scripts.py
lib_ldf_mode = deep+
lib_deps =
    https://github.com/voc-vach-iot-ch32v003/ch32v003_power.git#v2.0.5
    https://github.com/voc-vach-iot-ch32v003/ch32v003_gpio.git#v2.0.1
    https://github.com/voc-vach-iot-ch32v003/ch32v003_delay.git#v1.0.0
    https://github.com/voc-vach-iot-ch32v003/ch32v003_debug.git#v1.0.0

[env:CH32V003J4M6]
board = genericCH32V003J4M6
build_flags = -DCH32V003_J4M6

[env:CH32V003A4M6]
board = genericCH32V003A4M6
build_flags = -DCH32V003_A4M6

[env:CH32V003F4P6]
board = genericCH32V003F4P6
build_flags = -DCH32V003_F4P6
